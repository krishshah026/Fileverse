# Fileverse + automatic HTTPS (Caddy + Let's Encrypt).
#   1. Point your domain (e.g. yourname.duckdns.org) at this server's public IP.
#   2. echo "DOMAIN=yourname.duckdns.org" > .env
#   3. docker compose up -d --build
services:
  fileverse:
    build: .
    image: fileverse:latest
    restart: unless-stopped
    environment:
      PORT: 8080
      FILE_TTL_MINUTES: ${FILE_TTL_MINUTES:-120}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20480}
      UPLOAD_CHUNK_MB: ${UPLOAD_CHUNK_MB:-50}
      DISK_RESERVE_MB: ${DISK_RESERVE_MB:-4096}
      HEAVY_CONCURRENCY: ${HEAVY_CONCURRENCY:-1}
      LIGHT_CONCURRENCY: ${LIGHT_CONCURRENCY:-2}
      TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}
    volumes:
      - fileverse-data:/data
    expose:
      - "8080"
    ulimits:
      nofile: 65536
    stop_grace_period: 30s

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env, e.g. DOMAIN=yourname.duckdns.org}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - fileverse

volumes:
  fileverse-data:
  caddy-data:
  caddy-config:
